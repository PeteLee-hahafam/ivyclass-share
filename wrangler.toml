name = "ivyclass"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 사이트를 올릴 때마다 학원 PC 제작 엔진 파일을 함께 묶어요 (엔진 자동 업데이트용)
[build]
command = "node scripts/pack-engine.mjs"
watch_dir = ["src", "engine/ivy_engine"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*", "/manifest.webmanifest", "/_engine/*"]

# 데이터베이스 표는 사이트가 처음 요청을 받을 때 스스로 만들어요 (src/db.js)
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "ivyclass"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ivyclass-media"

[observability]
enabled = true
