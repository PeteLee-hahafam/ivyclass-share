# 강의실 새 버전을 6시간마다 받아 와요.
# 받으면 Cloudflare가 1~2분 안에 사이트를 새 버전으로 바꾸고, 학원 PC 제작 엔진도 쉬는 동안 스스로 업데이트해요.
# 학생 기록, 강의, 학원 설정은 그대로예요. 지금 바로 받으려면: Actions → 강의실 업데이트 → Run workflow
# 코드를 직접 고쳐 쓰려면 이 작업을 꺼 주세요 (Actions → 강의실 업데이트 → ··· → Disable workflow).
name: 강의실 업데이트

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ivyclass-update

jobs:
  update:
    # 만든 사람의 공개 저장소에서는 돌지 않아요
    if: github.repository != 'PeteLee-hahafam/ivyclass-share'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 새 버전 받기
        run: python3 scripts/update_from_upstream.py
      - name: 자동 업데이트를 계속 켜 두기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable" > /dev/null 2>&1 || true
